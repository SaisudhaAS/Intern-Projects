
<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center mb-4">Admin Dashboard</h2>

    <div class="mb-4">
      <h4>Manage Categories</h4>
      <div class="input-group">
        <input id="categoryName" class="form-control" placeholder="Category" />
        <button class="btn btn-primary" id="addCategoryBtn">Add</button>
      </div>
    </div>

    <div class="mb-4">
      <h4>Manage Cities</h4>
      <div class="input-group">
        <input id="cityName" class="form-control" placeholder="City" />
        <button class="btn btn-primary" id="addCityBtn">Add</button>
      </div>
    </div>

    <div class="mb-4">
      <h4>Manage Areas</h4>
      <div class="input-group">
        <input id="areaName" class="form-control" placeholder="Area" />
        <button class="btn btn-primary" id="addAreaBtn">Add</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
