
<!DOCTYPE html>
<html>
<head>
  <title>User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4 text-center">User Dashboard</h2>
    <div class="row g-3 mb-4">
      <div class="col-md-3"><input id="sportName" class="form-control" placeholder="Sport Name" /></div>
      <div class="col-md-3"><input id="category" class="form-control" placeholder="Category" /></div>
      <div class="col-md-3"><input id="city" class="form-control" placeholder="City" /></div>
      <div class="col-md-3"><input id="area" class="form-control" placeholder="Area" /></div>
    </div>
    <button class="btn btn-primary w-100 mb-4" id="addEventBtn">Add Event</button>
    <div id="eventsContainer" class="list-group"></div>
  </div>
  <script type="module" src="js/user.js"></script>
</body>
</html>
