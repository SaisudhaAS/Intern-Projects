<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-Teacher Booking Appointment</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-functions.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="appointments.js"></script>
</head>
<body class="bg-gradient-to-r from-blue-400 to-cyan-400 flex flex-col items-center justify-center h-screen">
    
    
    <header class="bg-gradient-to-r from-blue-600 to-blue-800 w-full py-5 text-center fixed top-0 shadow-md">
        <h1 class="text-3xl font-bold text-white">Student-Teacher Booking Appointment</h1>
    </header>

    
    <main class="flex flex-col items-center w-full mt-24">
        <section class="bg-white shadow-lg rounded-lg p-6 w-96 text-center" id="auth-section">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Login</h2>
            <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 border rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="login()" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">Login</button>
            <button onclick="register()" class="w-full mt-2 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400 transition">Register</button>
        </section>
    </main>

</body>
</html>
